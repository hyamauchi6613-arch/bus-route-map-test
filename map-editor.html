<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><title>停留所位置の登録ツール</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{padding:14px 16px;background:#fff;border-bottom:1px solid #dce2eb}h1{font-size:19px;margin:0 0 5px}p{margin:5px 0;font-size:13px;line-height:1.5}.warning{background:#fff4d8;border:1px solid #eed28a;border-radius:10px;padding:10px;margin:12px 12px 8px;font-size:13px;line-height:1.5}.layout{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:12px;padding:0 12px 12px;height:calc(100dvh - 150px);min-height:500px}.panel{background:#fff;border:1px solid #dce2eb;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}.controls{padding:12px;border-bottom:1px solid #e6eaf0;display:grid;gap:8px}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #ccd4df;background:white;color:#172033;width:100%;min-height:42px}button{font-weight:650;cursor:pointer;background:#f7f9fc}button.primary{background:#155eef;color:#fff;border-color:#155eef}button:disabled{opacity:.45;cursor:not-allowed}.small{font-size:12px;color:#5c6678}.stats{font-size:12px;color:#5c6678}.list{overflow:auto;overscroll-behavior:contain}.item{padding:11px 12px;border-bottom:1px solid #edf0f4;cursor:pointer}.item.active{background:#eaf1ff;border-left:4px solid #155eef;padding-left:8px}.item strong{display:block;font-size:14px}.item span{font-size:12px;color:#687386}.item .status{float:right;font-size:11px;padding:3px 6px;border-radius:99px;background:#fff0d4;color:#815500}.item .done{background:#dcfce7;color:#166534}.mapwrap{position:relative;min-height:0}#map{height:100%;width:100%;background:#e8edf2}.maptip{position:absolute;z-index:500;top:10px;left:10px;right:10px;pointer-events:none}.maptip span{display:inline-block;background:#fffF;border:1px solid #d7dce5;border-radius:8px;padding:7px 9px;font-size:12px;box-shadow:0 2px 8px #0001}.footer{padding:10px 12px;border-top:1px solid #e6eaf0;display:grid;gap:7px}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.leaflet-container{font-family:inherit}.leaflet-popup-content{font-size:14px}@media(max-width:760px){.layout{height:auto;min-height:0;grid-template-columns:1fr}.mapwrap{height:48dvh;min-height:320px;order:0}.panel:first-child{height:45dvh;min-height:300px;order:1}.layout{display:flex;flex-direction:column}.mapwrap{flex:none}.panel:first-child{flex:none}.warning{margin-bottom:10px}}
</style></head><body>
<header><h1>停留所位置の登録ツール</h1><p>実地図への移行準備用。地図をタップして停留所の位置を登録し、JSONとして書き出せます。</p></header>
<div class="warning"><b>注意：</b>これは座標登録用の試作ツールです。元データの停留所名・順序は未検証です。同名でも別の停留所である可能性があるため、表示名と公式資料を確認してから登録してください。登録内容はこのブラウザ内に一時保存されます。</div>
<div class="layout"><section class="panel"><div class="controls"><input id="search" placeholder="停留所名で検索"><select id="route"><option value="">全路線</option></select><select id="status"><option value="todo">未登録の停留所</option><option value="all">すべて</option><option value="done">登録済み</option></select><div class="stats" id="stats">データを読み込み中…</div></div><div class="list" id="list"></div><div class="footer"><div id="selectedLabel" class="small">停留所を選択してください</div><div class="btnrow"><button id="clear">位置を解除</button><button id="export" class="primary">JSONを書き出す</button></div><button id="importBtn">編集済み stops.json を読み込む</button><input id="importFile" type="file" accept="application/json,.json" hidden><p class="small">書き出したJSONをプロジェクトの data/stops.json と差し替えると、登録内容を次回も使えます。</p></div></section><section class="panel mapwrap"><div id="map"></div><div class="maptip"><span>①左の停留所を選択 → ②地図上の位置をタップ</span></div></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const STORAGE_KEY='shizutetsu_stop_coordinate_editor_v1';let stops=[],routes=[],selectedId=null,markers=new Map(),selectedMarker=null;
const $=id=>document.getElementById(id);const map=L.map('map').setView([34.9756,138.3828],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);
function saved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}
function isValid(s){return Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lon))&&s.lat!==null&&s.lon!==null&&Math.abs(Number(s.lat))<=90&&Math.abs(Number(s.lon))<=180}
function syncMarkers(){for(const [id,m] of markers){map.removeLayer(m)}markers.clear();for(const s of stops){if(!isValid(s))continue;const m=L.circleMarker([Number(s.lat),Number(s.lon)],{radius:s.id===selectedId?9:6,color:s.id===selectedId?'#155eef':'#15803d',weight:2,fillColor:s.id===selectedId?'#60a5fa':'#4ade80',fillOpacity:.9}).addTo(map).bindPopup(`<b>${esc(s.name)}</b><br>${s.locationStatus==='verified'?'確認済み':'位置登録済み（未検証）'}`);m.on('click',()=>selectStop(s.id,false));markers.set(s.id,m)}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(stops));}
function render(){const q=$('search').value.trim().toLowerCase(),r=$('route').value,mode=$('status').value;const routeStops=new Set();if(r){const rt=routes.find(x=>x.id===r);(rt?.stops||[]).forEach(n=>routeStops.add(n))}let filtered=stops.filter(s=>(!q||s.name.toLowerCase().includes(q))&&(!r||routeStops.has(s.name))&&(mode==='all'||(mode==='done'?isValid(s):!isValid(s))));$('stats').textContent=`全${stops.length}件 ／ 座標あり ${stops.filter(isValid).length}件 ／ 未登録 ${stops.filter(s=>!isValid(s)).length}件`;$('list').innerHTML=filtered.map(s=>`<div class="item ${s.id===selectedId?'active':''}" data-id="${esc(s.id)}"><strong>${esc(s.name)} <span class="status ${isValid(s)?'done':''}">${isValid(s)?'座標あり':'未登録'}</span></strong><span>${esc(s.id)}${isValid(s)?' · '+Number(s.lat).toFixed(5)+', '+Number(s.lon).toFixed(5):''}</span></div>`).join('')||'<div class="item">該当する停留所がありません</div>';document.querySelectorAll('.item[data-id]').forEach(el=>el.addEventListener('click',()=>selectStop(el.dataset.id,true)));$('selectedLabel').textContent=stops.find(s=>s.id===selectedId)?.name||'停留所を選択してください';}
function selectStop(id,focus){selectedId=id;const s=stops.find(x=>x.id===id);if(s&&isValid(s)&&focus)map.setView([Number(s.lat),Number(s.lon)],16);syncMarkers();render()}
map.on('click',e=>{if(!selectedId){alert('先に左の一覧から停留所を選択してください');return}const s=stops.find(x=>x.id===selectedId);if(!s)return;s.lat=Number(e.latlng.lat.toFixed(7));s.lon=Number(e.latlng.lng.toFixed(7));s.locationStatus='unverified';s.source='手動登録：OpenStreetMap上で位置を選択';persist();syncMarkers();render()});
$('search').addEventListener('input',render);$('route').addEventListener('change',render);$('status').addEventListener('change',render);$('clear').onclick=()=>{const s=stops.find(x=>x.id===selectedId);if(!s)return;s.lat=null;s.lon=null;s.locationStatus='unverified';s.source=null;persist();syncMarkers();render()};$('export').onclick=()=>{const data={schemaVersion:1,sourceNote:'Coordinates registered in the stop position editor. Review all coordinates before treating them as verified.',stops};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stops.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.stops))throw Error('stops 配列がありません');const incoming=new Map(d.stops.map(s=>[s.id,s]));stops=stops.map(s=>incoming.get(s.id)||s);persist();syncMarkers();render();alert('読み込みました。座標を確認してください。')}catch(err){alert('読み込みに失敗しました：'+err.message)}e.target.value=''};
async function init(){try{const [sd,rd]=await Promise.all([fetch('./data/stops.json').then(r=>{if(!r.ok)throw Error('stops.json');return r.json()}),fetch('./data/routes.json').then(r=>{if(!r.ok)throw Error('routes.json');return r.json()})]);stops=sd.stops;routes=rd.routes;const local=saved();stops=stops.map(s=>local[s.id]||s);$('route').innerHTML='<option value="">全路線</option>'+routes.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');syncMarkers();render()}catch(e){$('stats').textContent='データを読み込めません。GitHub PagesなどHTTP/HTTPS上で開き、data/stops.json と data/routes.json が同じフォルダ構成で存在するか確認してください。';$('list').innerHTML='<div class="item">'+esc(e.message)+'</div>'}}
init();
</script></body></html>
